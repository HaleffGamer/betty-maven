spring.application.name=betty
server.port=8080

# Mostra a mensagem de erro (ex.: "Horário indisponível") na resposta da API
server.error.include-message=always

# Durante o desenvolvimento, recarrega o HTML sem cache
spring.thymeleaf.cache=false

# Sessão de login da equipe (cookie só HTTP, não acessível por JavaScript)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# ---------- Banco de dados (H2 em arquivo) ----------
# Os dados ficam salvos em C:\Users\SEU_USUARIO\betty-data\betty.mv.db e NÃO somem ao reiniciar.
spring.datasource.url=jdbc:h2:file:~/betty-data/betty
spring.datasource.username=sa
spring.datasource.password=
# Cria as tabelas (schema.sql) se ainda não existirem
spring.sql.init.mode=always

# Senha inicial do usuário "dono" (usada só na PRIMEIRA execução, quando o banco está vazio).
# Troque aqui ANTES de rodar pela primeira vez.
betty.dono.senha=dono123
